<!DOCTYPE html>
<html lang="es">
<head>
  <meta property="og:title" content="Conversor BCV" />
<meta property="og:description" content="Calculadora de tasa oficial BCV" />
<meta property="og:image" content="https://plardgg.github.io/conversor-bcv/NOMBRE-DE-TU-IMAGEN" />
<meta property="og:url" content="https://plardgg.github.io/conversor-bcv/" />
<meta property="og:type" content="website" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor BCV - FENACOTECV</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      max-width: 480px;
      margin: 24px auto;
      padding: 14px;
      background: #f4f6f8;
      color: #222629;
    }
    .tarjeta {
      background: #ffffff;
      border-top: 5px solid #143642;
      border-radius: 8px;
      padding: 20px 22px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }
    h3 {
      margin: 0 0 14px 0;
      color: #143642;
      border-bottom: 2px solid #C59B27;
      padding-bottom: 8px;
      font-size: 18px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #143642;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      margin-bottom: 12px;
    }
    .resultado {
      background: #f8fafc;
      border-left: 4px solid #C59B27;
      padding: 12px 14px;
      border-radius: 5px;
      margin-bottom: 14px;
    }
    .total {
      font-size: 22px;
      font-weight: bold;
      color: #143642;
      margin-top: 4px;
    }
    .sub {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
    }
    button {
      width: 100%;
      padding: 11px 14px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background: #143642;
      color: #ffffff;
    }
    button:hover { background: #0d242d; }
    .estado {
      margin-top: 8px;
      font-size: 12px;
      font-weight: bold;
      color: #15803d;
      text-align: center;
      min-height: 16px;
    }
    #copiaManual {
      width: 100%;
      height: 78px;
      margin-top: 8px;
      padding: 8px;
      font-size: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      display: none;
      resize: none;
    }
  </style>
</head>
<body>
  <div class="tarjeta">
    <h3>Conversor BCV</h3>

    <label for="monto">Monto en referencia / divisa:</label>
    <input type="text" id="monto" placeholder="Ej. 10 o 25,50" autofocus>

    <label for="tasa">Tasa BCV:</label>
    <input type="text" id="tasa" value="919,8227">

    <div class="resultado">
      <div>Equivalente en Bolívares:</div>
      <div class="total" id="totalBs">Bs. 0,00</div>
      <div class="sub" id="lineaCalc">Ref.: 0,00 × Tasa: 919,8227</div>
    </div>

    <button type="button" id="btnCopiar">Copiar para WhatsApp</button>
    <div class="estado" id="estado"></div>
    <textarea id="copiaManual" readonly></textarea>
  </div>

  <script>
    function numVE(v) {
      if (!v) return 0;
      var s = String(v).trim().replace(/\s+/g, "");
      if (s.indexOf(",") !== -1 && s.indexOf(".") !== -1) {
        s = s.replace(/\./g, "").replace(",", ".");
      } else if (s.indexOf(",") !== -1) {
        s = s.replace(",", ".");
      }
      var n = parseFloat(s);
      return isNaN(n) ? 0 : n;
    }

    function fmtVE(n, dec) {
      if (typeof dec !== "number") dec = 2;
      var parts = n.toFixed(dec).split(".");
      var ent = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      return dec > 0 ? ent + "," + (parts[1] || "") : ent;
    }

    function actualizar() {
      var m = numVE(document.getElementById("monto").value);
      var t = numVE(document.getElementById("tasa").value);
      var tot = m * t;
      document.getElementById("totalBs").textContent = "Bs. " + fmtVE(tot, 2);
      document.getElementById("lineaCalc").textContent = "Ref.: " + fmtVE(m, 2) + " × Tasa: " + fmtVE(t, 4);
      document.getElementById("estado").textContent = "";
    }

    function copiarWA() {
      var m = numVE(document.getElementById("monto").value);
      var t = numVE(document.getElementById("tasa").value);
      var tot = fmtVE(m * t, 2);
      var msg = "*Conversión BCV*\n• *Monto ref.:* " + fmtVE(m, 2) + "\n• *Tasa:* " + fmtVE(t, 4) + "\n• *Total:* Bs. " + tot;

      var caja = document.getElementById("copiaManual");
      var est = document.getElementById("estado");
      caja.value = msg;
      caja.style.display = "block";
      caja.focus();
      caja.select();

      try {
        if (document.execCommand("copy")) {
          est.textContent = "Copiado al portapapeles.";
          return;
        }
      } catch (e) {}

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(msg).then(function() {
          est.textContent = "Copiado al portapapeles.";
        }, function() {
          est.textContent = "Listo para Ctrl + C abajo.";
        });
      } else {
        est.textContent = "Listo para Ctrl + C abajo.";
      }
    }

    ["input", "change", "keyup"].forEach(function(ev) {
      document.getElementById("monto").addEventListener(ev, actualizar);
      document.getElementById("tasa").addEventListener(ev, actualizar);
    });
    document.getElementById("btnCopiar").addEventListener("click", copiarWA);
    actualizar();
  </script>
</body>
</html>
