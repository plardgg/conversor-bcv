<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CONVERSOR DE DIVISA FENACOTECV-1942</title>
  <meta property="og:title" content="CONVERSOR DE DIVISA FENACOTECV-1942" />
  <meta property="og:description" content="Calculadora de tasa oficial BCV" />
  <meta property="og:image" content="https://plardgg.github.io/conversor-bcv/84-3d.jpeg" />
  <meta property="og:url" content="https://plardgg.github.io/conversor-bcv/" />
  <meta property="og:type" content="website" />
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
    }
    .estado {
      margin-top: 8px;
      font-size: 0.9rem;
    }
    #copiaManual {
      display: none;
      width: 100%;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div>
    <h1>CONVERSOR DE DIVISA FENACOTECV-1942</h1>
    <input id="monto" type="text" placeholder="Monto" />
    <input id="tasa" type="text" placeholder="Tasa BCV" />
    <div id="totalBs">Bs. 0,00</div>
    <div id="lineaCalc">Ref.: 0,00 × Tasa: 0,0000</div>
    <button id="btnCopiar" type="button">Copiar WhatsApp</button>
    <div class="estado" id="estado"></div>
    <textarea id="copiaManual" readonly></textarea>
  </div>

  <script>
    function numVE(v) {
      if (!v) return 0;
      var s = String(v).trim().replace(/\s+/g, "");
      if (s.indexOf(",") !== -1 && s.indexOf(".") !== -1) {
        s = s.replace(/\./g, "").replace(",", ".");
      } else if (s.indexOf(",") !== -1) {
        s = s.replace(",", ".");
      }
      var n = parseFloat(s);
      return isNaN(n) ? 0 : n;
    }

    function fmtVE(n, dec) {
      if (typeof dec !== "number") dec = 2;
      var parts = n.toFixed(dec).split(".");
      var ent = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      return dec > 0 ? ent + "," + (parts[1] || "") : ent;
    }

    function actualizar() {
      var m = numVE(document.getElementById("monto").value);
      var t = numVE(document.getElementById("tasa").value);
      var tot = m * t;
      document.getElementById("totalBs").textContent = "Bs. " + fmtVE(tot, 2);
      document.getElementById("lineaCalc").textContent = "Ref.: " + fmtVE(m, 2) + " × Tasa: " + fmtVE(t, 4);
      document.getElementById("estado").textContent = "";
    }

    function copiarWA() {
      var m = numVE(document.getElementById("monto").value);
      var t = numVE(document.getElementById("tasa").value);
      var tot = fmtVE(m * t, 2);
      var msg = "*Conversión BCV*\n• *Monto ref.:* " + fmtVE(m, 2) + "\n• *Tasa:* " + fmtVE(t, 4) + "\n• *Total:* Bs. " + tot;

      var caja = document.getElementById("copiaManual");
      var est = document.getElementById("estado");
      caja.value = msg;
      caja.style.display = "block";
      caja.focus();
      caja.select();

      try {
        if (document.execCommand("copy")) {
          est.textContent = "Copiado al portapapeles.";
          return;
        }
      } catch (e) {}

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(msg).then(function() {
          est.textContent = "Copiado al portapapeles.";
        }, function() {
          est.textContent = "Listo para Ctrl + C abajo.";
        });
      } else {
        est.textContent = "Listo para Ctrl + C abajo.";
      }
    }

    ["input", "change", "keyup"].forEach(function(ev) {
      document.getElementById("monto").addEventListener(ev, actualizar);
      document.getElementById("tasa").addEventListener(ev, actualizar);
    });
    document.getElementById("btnCopiar").addEventListener("click", copiarWA);
    actualizar();
  </script>
</body>
</html>
