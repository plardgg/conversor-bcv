<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONVERSOR DIVISA FENACOTECV-1942</title>
  <meta property="og:title" content="CONVERSOR DIVISA FENACOTECV-1942">
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #111318;
      --muted: #555b66;
      --accent: #b40000;
      --accent-dark: #8e0000;
      --navy: #14284b;
      --border: #dcdfe6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .tarjeta {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--border);
      border-top: 4px solid var(--accent);
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(17, 19, 24, 0.08);
    }

    .encabezado {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .logo-svg {
      width: 112px;
      height: 112px;
      margin-bottom: 10px;
      display: block;
    }

    .subtitulo {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--navy);
      margin-bottom: 4px;
    }

    h1 {
      font-size: 19px;
      line-height: 1.25;
      font-weight: 800;
      color: var(--text);
    }

    .campos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }

    @media (max-width: 460px) {
      .campos {
        grid-template-columns: 1fr;
      }
    }

    .grupo label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 6px;
    }

    .grupo input {
      width: 100%;
      padding: 11px 12px;
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      background: #ffffff;
      border: 1px solid #c5cbd6;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .grupo input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(180, 0, 0, 0.12);
    }

    .resultado-box {
      background: #fafafa;
      border: 1px solid var(--border);
      border-left: 4px solid var(--navy);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .monto-bs {
      font-size: 28px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
    }

    .detalle-ref {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }

    .btn-wa {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      background-color: var(--accent);
      border: none;
      border-radius: 7px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .btn-wa:hover {
      background-color: var(--accent-dark);
    }

    .estado {
      margin-top: 10px;
      min-height: 18px;
      font-size: 12px;
      font-weight: 600;
      color: var(--navy);
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="tarjeta">
    <header class="encabezado">

          <path d="M 130,320 C 121,309 116,299 116,290 C 123,297 128,308 130,320 Z"/>

          <path d="M 111,299 C 104,286 101,275 103,266 C 109,274 112,286 111,299 Z"/>
          <path d="M 108,300 C 97,298 87,294 81,285 C 91,287 101,292 108,300 Z"/>
          <path d="M 95,274 C 91,260 90,248 94,239 C 98,249 98,261 95,274 Z"/>
          <path d="M 92,275 C 82,271 74,264 70,255 C 79,259 87,266 92,275 Z"/>
          <path d="M 83,247 C 81,233 83,221 88,213 C 90,223 88,235 83,247 Z"/>

          <path d="M 74,220 C 71,210 68,200 68,192 C 74,200 76,210 74,220 Z"/>

          <!-- Rama derecha -->
          <path d="M 215,352 C 290,335 334,275 332,206" fill="none" stroke="#2e8b3c" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M 224,349 C 236,342 244,336 248,329 C 238,332 230,339 224,349 Z"/>
          <path d="M 227,349 C 237,353 248,354 257,350 C 247,347 236,347 227,349 Z"/>
          <path d="M 248,337 C 259,328 266,320 268,311 C 259,316 252,325 248,337 Z"/>
          <path d="M 251,338 C 262,341 273,340 281,334 C 271,333 260,334 251,338 Z"/>
          <path d="M 270,320 C 279,309 284,299 284,290 C 277,297 272,308 270,320 Z"/>
          <path d="M 273,321 C 284,322 295,319 302,312 C 292,312 281,315 273,321 Z"/>
          <path d="M 289,299 C 296,286 299,275 297,266 C 291,274 288,286 289,299 Z"/>
          <path d="M 292,300 C 303,298 313,294 319,285 C 309,287 299,292 292,300 Z"/>
          <path d="M 305,274 C 309,260 310,248 306,239 C 302,249 302,261 305,274 Z"/>
          <path d="M 308,275 C 318,271 326,264 330,255 C 321,259 313,266 308,275 Z"/>
          <path d="M 317,247 C 319,233 317,221 312,213 C 310,223 312,235 317,247 Z"/>
          <path d="M 320,248 C 328,242 334,233 336,223 C 328,229 323,238 320,248 Z"/>
          <path d="M 326,220 C 329,210 332,200 332,192 C 326,200 324,210 326,220 Z"/>
        </g>

        <!-- Tallos cruzados inferiores y año 1942 -->
        <line x1="184" y1="352" x2="162" y2="372" stroke="#2e8b3c" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="216" y1="352" x2="238" y2="372" stroke="#2e8b3c" stroke-width="2.5" stroke-linecap="round"/>
        <text x="200" y="376" font-family="Arial Narrow, Arial, sans-serif" font-weight="900" font-size="25" fill="#111111" text-anchor="middle">1942</text>

        <!-- Libros apilados en el centro -->
        <g stroke="#111111" stroke-width="1.8" stroke-linejoin="round">
          <!-- Libro superior azul -->
          <path d="M 173,204 L 228,204 L 228,214 L 173,214 C 168,214 168,204 173,204 Z" fill="#1565c0"/>
          <line x1="175" y1="209" x2="226" y2="209" stroke="#ffffff" stroke-width="1.2"/>

          <path d="M 175,214 L 231,214 L 231,224 L 175,224 C 170,224 170,214 175,214 Z" fill="#ffffff"/>

          <!-- Libro inferior blanco -->
          <path d="M 173,224 L 229,224 L 229,234 L 173,234 C 168,234 168,224 173,224 Z" fill="#ffffff"/>

        <!-- Balanza dorada -->
        <g stroke="#111111" stroke-width="1.6" stroke-linejoin="round">

      <div class="subtitulo">Calculadora de Referencia</div>
      <h1>CONVERSOR DIVISA FENACOTECV-1942</h1>
    </header>

    <section class="campos">
      <div class="grupo">
        <label for="monto">Monto</label>
        <input id="monto" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off">
      </div>
      <div class="grupo">
        <label for="tasa">Tasa BCV</label>
        <input id="tasa" type="text" inputmode="decimal" placeholder="919,8227" autocomplete="off">
      </div>
    </section>

    <section class="resultado-box" aria-live="polite">
      <div id="salidaBs" class="monto-bs">Bs. 0,00</div>
      <div id="salidaRef" class="detalle-ref">Ref.: 0,00 × Tasa: 919,8227</div>
    </section>

    <button id="btnCopiar" type="button" class="btn-wa">Copiar WhatsApp</button>
    <div id="estado" class="estado"></div>
  </main>

  <script>
    const inputMonto = document.getElementById("monto");
    const inputTasa = document.getElementById("tasa");
    const salidaBs = document.getElementById("salidaBs");
    const salidaRef = document.getElementById("salidaRef");
    const btnCopiar = document.getElementById("btnCopiar");
    const estado = document.getElementById("estado");

    const TASA_INICIAL = "919,8227";
    const CLAVE_TASA = "fenacotecv_1942_tasa_bcv";

    function parsearNumero(valor) {
      if (!valor) return 0;
      const limpio = String(valor).trim().replace(/\s+/g, "").replace(",", ".");
      const num = parseFloat(limpio);
      return Number.isFinite(num) ? num : 0;
    }

    function formatoVe(num, decimales) {
      return num.toLocaleString("es-VE", {
        minimumFractionDigits: decimales,
        maximumFractionDigits: decimales
      });
    }

    function actualizar() {
      const monto = parsearNumero(inputMonto.value);
      const tasa = parsearNumero(inputTasa.value);
      const totalBs = monto * tasa;

      salidaBs.textContent = "Bs. " + formatoVe(totalBs, 2);
      salidaRef.textContent =
        "Ref.: " + formatoVe(monto, 2) + " × Tasa: " + formatoVe(tasa, 4);

      try {
        localStorage.setItem(CLAVE_TASA, inputTasa.value);
      } catch (e) {}
    }

    function textoWhatsApp() {
      const monto = parsearNumero(inputMonto.value);
      const tasa = parsearNumero(inputTasa.value);
      const totalBs = monto * tasa;
      return "Ref.: " + formatoVe(monto, 2) + " -> Bs. " + formatoVe(totalBs, 2);
    }

    btnCopiar.addEventListener("click", async () => {
      const msg = textoWhatsApp();
      try {
        await navigator.clipboard.writeText(msg);
        estado.textContent = "Copiado para WhatsApp.";
      } catch (e) {
        const aux = document.createElement("textarea");
        aux.value = msg;
        document.body.appendChild(aux);
        aux.select();
        document.execCommand("copy");
        document.body.removeChild(aux);
        estado.textContent = "Copiado para WhatsApp.";
      }
      setTimeout(() => {
        estado.textContent = "";
      }, 2500);
    });

    inputMonto.addEventListener("input", actualizar);
    inputTasa.addEventListener("input", actualizar);

    let tasaCargada = "";
    try {
      tasaCargada = localStorage.getItem(CLAVE_TASA) || "";
    } catch (e) {}

    inputTasa.value = tasaCargada.trim() ? tasaCargada : TASA_INICIAL;
    actualizar();
  </script>
</body>
</html>
