<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONVERSOR DE DIVISA</title>
  <meta property="og:title" content="CONVERSOR DE DIVISA">
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #111318;
      --muted: #555b66;
      --accent: #b40000;
      --accent-dark: #8e0000;
      --navy: #14284b;
      --border: #dcdfe6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .tarjeta {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--border);
      border-top: 4px solid var(--accent);
      border-radius: 10px;
      padding: 26px 24px;
      box-shadow: 0 8px 24px rgba(17, 19, 24, 0.08);
    }

    .encabezado {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 18px;
    }

    .logo-institucional {
      width: 300px;
      height: 300px;
      object-fit: contain;
      margin-bottom: 12px;
      border-radius: 8px;
    }

    .subtitulo {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--navy);
      margin-bottom: 4px;
    }

    h1 {
      font-size: 20px;
      line-height: 1.25;
      font-weight: 800;
      color: var(--text);
    }

    .campos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }

    @media (max-width: 460px) {
      .campos {
        grid-template-columns: 1fr;
      }
    }

    .grupo label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 6px;
    }

    .grupo input {
      width: 100%;
      padding: 11px 12px;
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      background: #ffffff;
      border: 1px solid #c5cbd6;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .grupo input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(180, 0, 0, 0.12);
    }

    .resultado-box {
      background: #fafafa;
      border: 1px solid var(--border);
      border-left: 4px solid var(--navy);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .monto-bs {
      font-size: 28px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
    }

    .detalle-ref {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }

    .btn-wa {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      background-color: var(--accent);
      border: none;
      border-radius: 7px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .btn-wa:hover {
      background-color: var(--accent-dark);
    }

    .estado {
      margin-top: 10px;
      min-height: 18px;
      font-size: 12px;
      font-weight: 600;
      color: var(--navy);
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="tarjeta">
    <header class="encabezado">
      <img
        src="FENACOTECV1942.png"
        alt="Logo FENACOTECV-1942"
        class="logo-institucional"
        onerror="this.style.display='none'"
      >
      <h1>CONVERSOR DE DIVISA</h1>
    </header>

    <section class="campos">
      <div class="grupo">
        <label for="monto">Monto</label>
        <input id="monto" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off">
      </div>
      <div class="grupo">
        <label for="tasa">Tasa BCV</label>
        <input id="tasa" type="text" inputmode="decimal" placeholder="919,8227" autocomplete="off">
      </div>
    </section>

    <section class="resultado-box" aria-live="polite">
      <div id="salidaBs" class="monto-bs">Bs. 0,00</div>
      <div id="salidaRef" class="detalle-ref">Ref.: 0,00 × Tasa: 919,8227</div>
    </section>

    <button id="btnCopiar" type="button" class="btn-wa">Copiar WhatsApp</button>
    <div id="estado" class="estado"></div>
  </main>

  <script>
    const inputMonto = document.getElementById("monto");
    const inputTasa = document.getElementById("tasa");
    const salidaBs = document.getElementById("salidaBs");
    const salidaRef = document.getElementById("salidaRef");
    const btnCopiar = document.getElementById("btnCopiar");
    const estado = document.getElementById("estado");

    const TASA_INICIAL = "919,8227";
    const CLAVE_TASA = "fenacotecv_1942_tasa_bcv";
    const INTERVALO_BCV_MS = 15 * 60 * 1000;
    const ESPERA_TRAS_CALCULO_MS = 1800; // Vuelve a la tasa BCV tras mostrar el resultado

    let usoManualPendiente = false;
    let temporizadorRetorno = null;

    function parsearNumero(valor) {
      if (!valor) return 0;
      const limpio = String(valor).trim().replace(/\s+/g, "").replace(",", ".");
      const num = parseFloat(limpio);
      return Number.isFinite(num) ? num : 0;
    }

    function formatoVe(num, decimales) {
      return num.toLocaleString("es-VE", {
        minimumFractionDigits: decimales,
        maximumFractionDigits: decimales
      });
    }

    function actualizar() {
      const monto = parsearNumero(inputMonto.value);
      const tasa = parsearNumero(inputTasa.value);
      const totalBs = monto * tasa;

      salidaBs.textContent = "Bs. " + formatoVe(totalBs, 2);
      salidaRef.textContent =
        "Ref.: " + formatoVe(monto, 2) + " × Tasa: " + formatoVe(tasa, 4);

      try {
        localStorage.setItem(CLAVE_TASA, inputTasa.value);
      } catch (e) {}
    }

    function programarRetornoABcv() {
      if (!usoManualPendiente) return;
      clearTimeout(temporizadorRetorno);
      temporizadorRetorno = setTimeout(() => {
        usoManualPendiente = false;
        sincronizarTasaBCV(true);
      }, ESPERA_TRAS_CALCULO_MS);
    }

    function textoWhatsApp() {
      const monto = parsearNumero(inputMonto.value);
      const tasa = parsearNumero(inputTasa.value);
      const totalBs = monto * tasa;
      return "Ref.: " + formatoVe(monto, 2) + " -> Bs. " + formatoVe(totalBs, 2);
    }

    btnCopiar.addEventListener("click", async () => {
      const msg = textoWhatsApp();
      try {
        await navigator.clipboard.writeText(msg);
        estado.textContent = "Copiado para WhatsApp.";
      } catch (e) {
        const aux = document.createElement("textarea");
        aux.value = msg;
        document.body.appendChild(aux);
        aux.select();
        document.execCommand("copy");
        document.body.removeChild(aux);
        estado.textContent = "Copiado para WhatsApp.";
      }
      setTimeout(() => {
        estado.textContent = "";
      }, 2500);

      if (usoManualPendiente) {
        clearTimeout(temporizadorRetorno);
        usoManualPendiente = false;
        sincronizarTasaBCV(true);
      }
    });

    function formatearTasaInput(valorNum) {
      return Number(valorNum).toFixed(4).replace(".", ",");
    }

    async function obtenerTasaBCV() {
      const fuentes = [
        async () => {
          const res = await fetch("https://ve.dolarapi.com/v1/dolares/oficial", { cache: "no-store" });
          if (!res.ok) throw new Error("Error DolarApi");
          const data = await res.json();
          return Number(data.promedio ?? data.venta ?? data.compra);
        },
        async () => {
          const res = await fetch("https://pydolarve.org/api/v1/dollar?page=bcv", { cache: "no-store" });
          if (!res.ok) throw new Error("Error PyDolar");
          const data = await res.json();
          const usd = data?.monitors?.usd;
          return Number(usd?.price ?? usd?.last_price);
        }
      ];

      for (const consultar of fuentes) {
        try {
          const tasa = await consultar();
          if (Number.isFinite(tasa) && tasa > 0) {
            return tasa;
          }
        } catch (err) {}
      }
      return null;
    }

    async function sincronizarTasaBCV(silencioso = true) {
      const nuevaTasa = await obtenerTasaBCV();
      if (!nuevaTasa) {
        if (!silencioso) {
          estado.textContent = "Sin conexión; se mantiene la tasa actual.";
          setTimeout(() => {
            estado.textContent = "";
          }, 3000);
        }
        return;
      }

      const tasaActual = parsearNumero(inputTasa.value);
      if (Math.abs(nuevaTasa - tasaActual) >= 0.0001) {
        inputTasa.value = formatearTasaInput(nuevaTasa);
        actualizar();
        estado.textContent = "Tasa BCV actualizada: " + formatoVe(nuevaTasa, 4);
        setTimeout(() => {
          estado.textContent = "";
        }, 3500);
      }
    }

    inputMonto.addEventListener("input", () => {
      actualizar();
      programarRetornoABcv();
    });

    inputTasa.addEventListener("input", () => {
      usoManualPendiente = true;
      actualizar();
      programarRetornoABcv();
    });

    let tasaCargada = "";
    try {
      tasaCargada = localStorage.getItem(CLAVE_TASA) || "";
    } catch (e) {}

    inputTasa.value = tasaCargada.trim() ? tasaCargada : TASA_INICIAL;
    actualizar();

    sincronizarTasaBCV(true);
    setInterval(() => sincronizarTasaBCV(true), INTERVALO_BCV_MS);

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        sincronizarTasaBCV(true);
      }
    });
  </script>
</body>
</html>
